name: tests

on:
  pull_request:
    branches: [main]

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sh bin/afc test
      - run: sh bin/afc guard --since "origin/${{ github.base_ref }}"
